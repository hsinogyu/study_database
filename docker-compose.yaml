services:
  mysql:
    image: mysql:8.4
    container_name: study_database
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: study_database_db
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
